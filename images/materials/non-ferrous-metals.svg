<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="60%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#1b283d"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="aluGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <pattern id="gridPattern2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#202b3d" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad2)"/>
  <rect width="600" height="380" fill="url(#gridPattern2)" opacity="0.6"/>
  <circle cx="300" cy="190" r="140" fill="#10b981" opacity="0.12" filter="blur(30px)"/>

  <!-- Copper Busbar & Wire Coil (Center Left) -->
  <g transform="translate(60, 90)">
    <!-- Heavy Solid Copper Busbar -->
    <polygon points="20,130 160,50 200,75 60,155" fill="url(#copperGrad)"/>
    <polygon points="60,155 200,75 200,95 60,175" fill="#9a3412"/>
    <polygon points="20,130 60,155 60,175 20,150" fill="#7c2d12"/>
    <!-- Hole in busbar -->
    <ellipse cx="60" cy="142" rx="10" ry="6" fill="#141c2b"/>
    <ellipse cx="120" cy="108" rx="10" ry="6" fill="#141c2b"/>

    <!-- Bright Copper Wire Loops -->
    <ellipse cx="140" cy="140" rx="60" ry="30" fill="none" stroke="#ea580c" stroke-width="9"/>
    <ellipse cx="145" cy="145" rx="60" ry="30" fill="none" stroke="#f97316" stroke-width="7"/>
    <ellipse cx="150" cy="150" rx="60" ry="30" fill="none" stroke="#fdba74" stroke-width="4"/>
  </g>

  <!-- Aluminum Extrusion 6063 Profile (Center Right) -->
  <g transform="translate(310, 80)">
    <!-- Hollow Box Profile -->
    <polygon points="30,40 150,40 210,120 90,120" fill="url(#aluGrad)"/>
    <polygon points="210,120 150,40 150,180 210,260" fill="#64748b"/>
    <polygon points="90,120 210,120 210,260 90,260" fill="#94a3b8"/>
    <!-- Hollow Core Front -->
    <polygon points="110,140 190,140 190,240 110,240" fill="#1e293b"/>
    <!-- Secondary Extrusion Fin -->
    <polygon points="40,200 90,200 90,220 40,220" fill="url(#aluGrad)"/>
  </g>

  <!-- Yellow Brass Industrial Valve & Fitting (Bottom Center) -->
  <g transform="translate(230, 190)">
    <!-- Valve Body -->
    <rect x="40" y="50" width="70" height="45" rx="4" fill="url(#brassGrad)"/>
    <!-- Flange Left -->
    <rect x="25" y="40" width="15" height="65" rx="3" fill="#ca8a04"/>
    <!-- Flange Right -->
    <rect x="110" y="40" width="15" height="65" rx="3" fill="#ca8a04"/>
    <!-- Valve Stem -->
    <rect x="68" y="20" width="14" height="30" fill="#eab308"/>
    <!-- Valve Handwheel -->
    <ellipse cx="75" cy="18" rx="28" ry="8" fill="#a16207" stroke="#fde047" stroke-width="3"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="210" height="34" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" fill="#6ee7b7" letter-spacing="1">NON-FERROUS METALS</text>
  </g>

  <!-- Specs Overlay Ribbon -->
  <g transform="translate(390, 30)">
    <rect width="180" height="34" rx="4" fill="rgba(243, 207, 45, 0.15)" stroke="#f3cf2d" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13" fill="#f3cf2d">COPPER • ALU • BRASS</text>
  </g>
</svg>
