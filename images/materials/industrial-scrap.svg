<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="60%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#1b283d"/>
    </linearGradient>
    <linearGradient id="metalHeavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPattern4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#202b3d" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad4)"/>
  <rect width="600" height="380" fill="url(#gridPattern4)" opacity="0.6"/>
  <circle cx="300" cy="190" r="140" fill="#f59e0b" opacity="0.12" filter="blur(30px)"/>

  <!-- Heavy Lifting Magnet with Chains (Top Center) -->
  <g transform="translate(240, 70)">
    <!-- Magnet Plate -->
    <ellipse cx="60" cy="50" rx="70" ry="24" fill="#0f172a" stroke="#f3cf2d" stroke-width="4"/>
    <ellipse cx="60" cy="46" rx="60" ry="18" fill="#1e293b"/>
    <!-- Center Eyelet -->
    <circle cx="60" cy="20" r="12" fill="none" stroke="#cbd5e1" stroke-width="5"/>
    <line x1="60" y1="20" x2="60" y2="40" stroke="#cbd5e1" stroke-width="6"/>
    <!-- Chains Left & Right -->
    <line x1="20" y1="46" x2="60" y2="20" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6 3"/>
    <line x1="100" y1="46" x2="60" y2="20" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6 3"/>
    <!-- Magnetic Field Lines Below -->
    <path d="M 20,70 Q 60,95 100,70" fill="none" stroke="#f3cf2d" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
    <path d="M 5,80 Q 60,115 115,80" fill="none" stroke="#f3cf2d" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  </g>

  <!-- Industrial Scrap Pile (Bottom) -->
  <g transform="translate(50, 180)">
    <!-- Crushed Structural Column 1 -->
    <polygon points="40,90 280,30 290,48 50,110" fill="url(#metalHeavy)"/>
    <!-- Bent Steel Plate 2 -->
    <polygon points="120,40 380,80 370,110 110,70" fill="#475569"/>
    <!-- Angle Iron 3 -->
    <polygon points="200,90 480,20 490,35 210,105" fill="#334155"/>
    <!-- Cross Cut Pipe 4 -->
    <ellipse cx="140" cy="110" rx="30" ry="18" fill="#1e293b" stroke="#94a3b8" stroke-width="6"/>
    <polygon points="166,102 320,50 320,70 166,122" fill="#475569"/>
    <!-- Sheared Plate Shards -->
    <polygon points="60,130 110,100 130,135 70,150" fill="#64748b"/>
    <polygon points="340,90 410,70 430,110 360,120" fill="#94a3b8"/>
    <polygon points="220,110 270,95 280,125 230,135" fill="#f3cf2d" opacity="0.9"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="210" height="34" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" fill="#fcd34d" letter-spacing="1">INDUSTRIAL METAL SCRAP</text>
  </g>

  <!-- Specs Overlay Ribbon -->
  <g transform="translate(380, 30)">
    <rect width="190" height="34" rx="4" fill="rgba(243, 207, 45, 0.15)" stroke="#f3cf2d" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13" fill="#f3cf2d">BULK PLANT CLEARANCE</text>
  </g>
</svg>
