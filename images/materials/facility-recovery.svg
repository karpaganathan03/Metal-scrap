<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="facBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e16"/>
      <stop offset="60%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#1a2232"/>
    </linearGradient>
    <linearGradient id="moltenMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="ingotAl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#facBg)"/>
  <circle cx="180" cy="180" r="140" fill="#ea580c" opacity="0.15" filter="blur(35px)"/>

  <!-- High-Bay Secondary Smelting Reverberatory Furnace (Left) -->
  <g transform="translate(60, 80)">
    <!-- Furnace Shell -->
    <path d="M 20,40 L 180,40 L 190,180 L 10,180 Z" fill="#1e293b" stroke="#f3cf2d" stroke-width="2"/>
    <!-- Furnace Door Open showing Molten Secondary Bath -->
    <ellipse cx="100" cy="120" rx="60" ry="40" fill="url(#moltenMetal)" stroke="#f59e0b" stroke-width="3"/>
    <!-- Exhaust Hood / Flue -->
    <polygon points="70,0 130,0 150,40 50,40" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <!-- Pouring Spout & Stream -->
    <path d="M 160,140 L 220,170 L 210,210 L 150,170 Z" fill="#b91c1c"/>
    <path d="M 180,150 L 220,180 L 220,220 L 180,180 Z" fill="url(#moltenMetal)"/>
  </g>

  <!-- Continuous Ingot Casting Conveyor (Right) -->
  <g transform="translate(300, 150)">
    <!-- Conveyor Rails -->
    <line x1="0" y1="90" x2="240" y2="40" stroke="#475569" stroke-width="8"/>
    <!-- Ingot Mold 1 -->
    <polygon points="20,80 70,70 85,95 35,105" fill="url(#ingotAl)" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Ingot Mold 2 (Molten filled) -->
    <polygon points="90,65 140,55 155,80 105,90" fill="url(#moltenMetal)" stroke="#fde047" stroke-width="1.5"/>
    <!-- Ingot Mold 3 -->
    <polygon points="160,50 210,40 225,65 175,75" fill="url(#ingotAl)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Stacked Finished Secondary Ingots (Foreground) -->
    <g transform="translate(40, 70)">
      <polygon points="0,30 90,10 110,20 20,40" fill="url(#ingotAl)" stroke="#f8fafc" stroke-width="1.2"/>
      <polygon points="0,30 20,40 20,55 0,45" fill="#334155"/>
      <polygon points="20,40 110,20 110,35 20,55" fill="#64748b"/>

      <polygon points="10,15 100,-5 120,5 30,25" fill="url(#ingotAl)" stroke="#f8fafc" stroke-width="1.2"/>
      <polygon points="10,15 30,25 30,40 10,30" fill="#334155"/>
      <polygon points="30,25 120,5 120,20 30,40" fill="#64748b"/>
    </g>
  </g>

  <!-- Technical Spec Overlay Badge -->
  <rect x="25" y="25" width="250" height="42" rx="6" fill="#090d14" fill-opacity="0.85" stroke="#f3cf2d" stroke-width="1.5"/>
  <circle cx="45" cy="46" r="6" fill="#ea580c"/>
  <text x="62" y="43" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" letter-spacing="1">RECOVERY &amp; INGOT CASTING</text>
  <text x="62" y="58" fill="#fdba74" font-family="'Poppins', sans-serif" font-size="11">Secondary Smelting | Ingot &amp; Billet Production</text>
</svg>