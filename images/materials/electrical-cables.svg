<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="60%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#1b283d"/>
    </linearGradient>
    <linearGradient id="cuCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <pattern id="gridPattern5" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#202b3d" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad5)"/>
  <rect width="600" height="380" fill="url(#gridPattern5)" opacity="0.6"/>
  <circle cx="300" cy="190" r="140" fill="#3b82f6" opacity="0.12" filter="blur(30px)"/>

  <!-- High-Voltage Armored Power Cable Cross Section (Center Left) -->
  <g transform="translate(100, 100)">
    <!-- Outer Black XLPE Jacket -->
    <circle cx="90" cy="90" r="85" fill="#090d16" stroke="#475569" stroke-width="4"/>
    <!-- Steel Wire Armor Layer -->
    <circle cx="90" cy="90" r="76" fill="none" stroke="#94a3b8" stroke-width="6" stroke-dasharray="8 3"/>
    <!-- Inner Sheath -->
    <circle cx="90" cy="90" r="68" fill="#1e293b"/>

    <!-- 3 Core Conductors (Red, Yellow, Blue Insulators with Copper Center) -->
    <!-- Core 1 (Top) -->
    <circle cx="90" cy="52" r="26" fill="#ef4444"/>
    <circle cx="90" cy="52" r="16" fill="url(#cuCore)"/>
    <circle cx="90" cy="52" r="6" fill="#fed7aa"/>

    <!-- Core 2 (Bottom Left) -->
    <circle cx="58" cy="108" r="26" fill="#eab308"/>
    <circle cx="58" cy="108" r="16" fill="url(#cuCore)"/>
    <circle cx="58" cy="108" r="6" fill="#fed7aa"/>

    <!-- Core 3 (Bottom Right) -->
    <circle cx="122" cy="108" r="26" fill="#3b82f6"/>
    <circle cx="122" cy="108" r="16" fill="url(#cuCore)"/>
    <circle cx="122" cy="108" r="6" fill="#fed7aa"/>
  </g>

  <!-- Heavy Industrial Electric Motor Stator (Center Right) -->
  <g transform="translate(330, 90)">
    <!-- Stator Casing -->
    <circle cx="100" cy="100" r="80" fill="#1e293b" stroke="#64748b" stroke-width="10"/>
    <circle cx="100" cy="100" r="50" fill="#0f172a" stroke="#f3cf2d" stroke-width="4"/>
    <!-- Copper Coil Windings in slots -->
    <circle cx="100" cy="40" r="10" fill="url(#cuCore)"/>
    <circle cx="100" cy="160" r="10" fill="url(#cuCore)"/>
    <circle cx="40" cy="100" r="10" fill="url(#cuCore)"/>
    <circle cx="160" cy="100" r="10" fill="url(#cuCore)"/>
    <circle cx="58" cy="58" r="10" fill="url(#cuCore)"/>
    <circle cx="142" cy="142" r="10" fill="url(#cuCore)"/>
    <circle cx="58" cy="142" r="10" fill="url(#cuCore)"/>
    <circle cx="142" cy="58" r="10" fill="url(#cuCore)"/>
    <!-- Rotor Bore Center -->
    <circle cx="100" cy="100" r="28" fill="#334155"/>
    <circle cx="100" cy="100" r="12" fill="#090d16"/>
  </g>

  <!-- Electrical Cable Ribbon Overlay -->
  <path d="M 40,310 Q 180,240 320,290 T 560,260" fill="none" stroke="#ea580c" stroke-width="8"/>
  <path d="M 50,325 Q 190,255 330,305 T 570,275" fill="none" stroke="#f3cf2d" stroke-width="6"/>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="210" height="34" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" fill="#93c5fd" letter-spacing="1">ELECTRICAL &amp; CABLE SCRAP</text>
  </g>

  <!-- Specs Overlay Ribbon -->
  <g transform="translate(380, 30)">
    <rect width="190" height="34" rx="4" fill="rgba(243, 207, 45, 0.15)" stroke="#f3cf2d" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13" fill="#f3cf2d">45% - 72% COPPER RECOVERY</text>
  </g>
</svg>
