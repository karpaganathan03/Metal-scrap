<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="feBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="60%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#181e28"/>
    </linearGradient>
    <linearGradient id="castIron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ironRust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="feGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#222b3a" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#feBg)"/>
  <rect width="600" height="380" fill="url(#feGrid)" opacity="0.5"/>
  <circle cx="300" cy="190" r="150" fill="#64748b" opacity="0.12" filter="blur(40px)"/>

  <!-- Heavy Cast Iron Machinery Block / Engine Block Base -->
  <g transform="translate(80, 90)">
    <!-- Base block 3D -->
    <polygon points="40,80 240,30 320,70 120,120" fill="url(#castIron)" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="40,80 120,120 120,200 40,160" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <polygon points="120,120 320,70 320,150 120,200" fill="#1e293b" stroke="#475569" stroke-width="1"/>

    <!-- Cylinder Bores on Top Face -->
    <ellipse cx="140" cy="85" rx="22" ry="11" fill="#080a0e" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="195" cy="72" rx="22" ry="11" fill="#080a0e" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="250" cy="58" rx="22" ry="11" fill="#080a0e" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Cast Webbing & Stiffeners -->
    <path d="M 80,140 L 80,180" stroke="#475569" stroke-width="3"/>
    <path d="M 170,145 L 170,185" stroke="#475569" stroke-width="3"/>
    <path d="M 230,130 L 230,170" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- Heavy Cast Iron Counterweight (Right) -->
  <g transform="translate(360, 100)">
    <polygon points="20,50 140,20 180,50 60,80" fill="url(#ironRust)" stroke="#94a3b8" stroke-width="1.2"/>
    <polygon points="20,50 60,80 60,160 20,130" fill="#0f172a"/>
    <polygon points="60,80 180,50 180,130 60,160" fill="#1e293b"/>
    <!-- Lifting Lug Pin Slot -->
    <ellipse cx="100" cy="50" rx="15" ry="7" fill="#080a0e" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Technical Spec Overlay Badge -->
  <rect x="25" y="25" width="230" height="42" rx="6" fill="#090d14" fill-opacity="0.85" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="45" cy="46" r="6" fill="#94a3b8"/>
  <text x="62" y="43" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" letter-spacing="1">CAST IRON SCRAP (ISRI: CUPOLA)</text>
  <text x="62" y="58" fill="#cbd5e1" font-family="'Poppins', sans-serif" font-size="11">Machine Bases | Engine Blocks &amp; Weights</text>
</svg>