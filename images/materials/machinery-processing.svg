<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="machBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="60%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#1e2636"/>
    </linearGradient>
    <linearGradient id="shearSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bladeGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#machBg)"/>
  <circle cx="300" cy="190" r="150" fill="#f59e0b" opacity="0.1" filter="blur(40px)"/>

  <!-- 1,200-Ton Heavy Hydraulic Guillotine Shear (Left) -->
  <g transform="translate(60, 60)">
    <!-- Shear Heavy Gantry Frame -->
    <rect x="20" y="20" width="180" height="240" fill="url(#shearSteel)" stroke="#f3cf2d" stroke-width="2"/>
    <rect x="50" y="60" width="120" height="180" fill="#090d14" stroke="#475569" stroke-width="1.5"/>

    <!-- Twin Hydraulic Rams Top -->
    <rect x="55" y="0" width="30" height="60" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/>
    <rect x="135" y="0" width="30" height="60" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/>

    <!-- Shear Blade Slide Crosshead -->
    <polygon points="50,110 170,110 170,160 50,140" fill="url(#bladeGleam)" stroke="#ffffff" stroke-width="2"/>

    <!-- Scrap Beam Feed Trough -->
    <polygon points="0,180 180,180 230,220 50,220" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Beam Sliced -->
    <rect x="20" y="165" width="140" height="15" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>

    <!-- Sparks Flying from Shear Cut -->
    <g stroke="#fde047" stroke-width="2" stroke-linecap="round">
      <line x1="160" y1="160" x2="190" y2="145"/>
      <line x1="165" y1="165" x2="200" y2="160"/>
      <line x1="160" y1="170" x2="195" y2="185"/>
      <line x1="155" y1="175" x2="180" y2="200"/>
    </g>
  </g>

  <!-- 4,000 HP Industrial Mega Shredder Rotor (Right) -->
  <g transform="translate(350, 90)">
    <!-- Shredder Housing Arc -->
    <path d="M 20,180 A 90 90 0 0 1 200,180" fill="none" stroke="#475569" stroke-width="16"/>
    <!-- Rotor Drum Core -->
    <circle cx="110" cy="110" r="50" fill="url(#shearSteel)" stroke="#f3cf2d" stroke-width="3"/>
    <circle cx="110" cy="110" r="16" fill="#090d14"/>

    <!-- 4 Heavy Cast Alloy Hammers Extended -->
    <g transform="rotate(25 110 110)">
      <polygon points="100,50 120,50 125,10 95,10" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.5"/>
      <polygon points="100,170 120,170 125,210 95,210" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.5"/>
      <polygon points="50,100 50,120 10,125 10,95" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.5"/>
      <polygon points="170,100 170,120 210,125 210,95" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.5"/>
    </g>

    <!-- Shredded Scrap Fragments Below Rotor -->
    <g fill="#cbd5e1" stroke="#334155" stroke-width="1">
      <polygon points="50,200 65,190 75,210 55,215"/>
      <polygon points="90,195 115,190 110,215 85,210"/>
      <polygon points="135,200 155,195 160,220 140,215"/>
      <polygon points="170,190 190,200 180,225 165,210"/>
    </g>
  </g>

  <!-- Technical Spec Overlay Badge -->
  <rect x="25" y="25" width="250" height="42" rx="6" fill="#090d14" fill-opacity="0.85" stroke="#f3cf2d" stroke-width="1.5"/>
  <circle cx="45" cy="46" r="6" fill="#f3cf2d"/>
  <text x="62" y="43" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" letter-spacing="1">PROCESSING INFRASTRUCTURE</text>
  <text x="62" y="58" fill="#fde047" font-family="'Poppins', sans-serif" font-size="11">1,200-Ton Shear &amp; 4,000 HP Mega Shredder</text>
</svg>