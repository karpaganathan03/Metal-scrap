<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="60%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#1b283d"/>
    </linearGradient>
    <linearGradient id="yellowCrane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="pistonChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <pattern id="gridPattern6" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#202b3d" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad6)"/>
  <rect width="600" height="380" fill="url(#gridPattern6)" opacity="0.6"/>
  <circle cx="300" cy="190" r="140" fill="#f59e0b" opacity="0.12" filter="blur(30px)"/>

  <!-- Heavy Hydraulic Ram / Cylinder (Center Left) -->
  <g transform="translate(60, 140)">
    <!-- Outer Cylinder Barrel -->
    <rect x="20" y="40" width="200" height="60" rx="6" fill="#1e293b" stroke="#f3cf2d" stroke-width="3"/>
    <rect x="15" y="32" width="20" height="76" rx="4" fill="#334155"/>
    <circle cx="25" cy="70" r="8" fill="#0f172a"/>
    <!-- Polished Chrome Piston Rod Extending -->
    <rect x="220" y="50" width="130" height="40" rx="3" fill="url(#pistonChrome)"/>
    <!-- Rod Eyelet Mounting -->
    <rect x="350" y="44" width="30" height="52" rx="4" fill="#334155"/>
    <circle cx="365" cy="70" r="12" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- Structural Truss & Gantry Section (Center Right) -->
  <g transform="translate(320, 80)">
    <!-- Top & Bottom Chords -->
    <polygon points="20,40 240,40 240,55 20,55" fill="url(#yellowCrane)"/>
    <polygon points="20,160 240,160 240,175 20,175" fill="url(#yellowCrane)"/>
    <!-- Diagonal Lattice Webbing -->
    <line x1="20" y1="55" x2="70" y2="160" stroke="#fde047" stroke-width="8"/>
    <line x1="70" y1="160" x2="120" y2="55" stroke="#fde047" stroke-width="8"/>
    <line x1="120" y1="55" x2="170" y2="160" stroke="#fde047" stroke-width="8"/>
    <line x1="170" y1="160" x2="220" y2="55" stroke="#fde047" stroke-width="8"/>
    <!-- Vertical Struts -->
    <line x1="20" y1="55" x2="20" y2="160" stroke="#ca8a04" stroke-width="8"/>
    <line x1="70" y1="55" x2="70" y2="160" stroke="#ca8a04" stroke-width="8"/>
    <line x1="120" y1="55" x2="120" y2="160" stroke="#ca8a04" stroke-width="8"/>
    <line x1="170" y1="55" x2="170" y2="160" stroke="#ca8a04" stroke-width="8"/>
    <line x1="220" y1="55" x2="220" y2="160" stroke="#ca8a04" stroke-width="8"/>
    <!-- Sheared Cut Torch Edge -->
    <path d="M 240,35 Q 248,50 240,65 Q 248,80 240,95 Q 248,110 240,125 Q 248,140 240,155 Q 248,170 240,180" fill="none" stroke="#ef4444" stroke-width="4"/>
  </g>

  <!-- Heavy Steel Sledge Cog (Foreground) -->
  <g transform="translate(180, 220)">
    <circle cx="50" cy="50" r="40" fill="#334155" stroke="#cbd5e1" stroke-width="6"/>
    <circle cx="50" cy="50" r="20" fill="#0f172a"/>
    <rect x="44" y="2" width="12" height="14" fill="#94a3b8"/>
    <rect x="44" y="84" width="12" height="14" fill="#94a3b8"/>
    <rect x="2" y="44" width="14" height="12" fill="#94a3b8"/>
    <rect x="84" y="44" width="14" height="12" fill="#94a3b8"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="240" height="34" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" fill="#fcd34d" letter-spacing="1">MACHINERY &amp; STRUCTURAL</text>
  </g>

  <!-- Specs Overlay Ribbon -->
  <g transform="translate(400, 30)">
    <rect width="170" height="34" rx="4" fill="rgba(243, 207, 45, 0.15)" stroke="#f3cf2d" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13" fill="#f3cf2d">HEAVY SHEAR READY</text>
  </g>
</svg>
