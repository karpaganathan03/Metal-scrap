<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="brBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14"/>
      <stop offset="60%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#22242c"/>
    </linearGradient>
    <linearGradient id="brValve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="25%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="bronzeBushing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="80%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <pattern id="brGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d2b38" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#brBg)"/>
  <rect width="600" height="380" fill="url(#brGrid)" opacity="0.5"/>
  <circle cx="300" cy="190" r="150" fill="#eab308" opacity="0.12" filter="blur(40px)"/>

  <!-- Heavy Industrial Brass Gate Valve (Center Left) -->
  <g transform="translate(100, 70)">
    <!-- Valve Body Cross -->
    <path d="M 30,120 L 70,120 L 70,80 L 130,80 L 130,120 L 170,120 L 180,110 L 180,170 L 170,160 L 130,160 L 130,200 L 70,200 L 70,160 L 30,160 L 20,170 L 20,110 Z" fill="url(#brValve)" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Flange Left -->
    <ellipse cx="20" cy="140" rx="10" ry="28" fill="#ca8a04" stroke="#fef08a" stroke-width="1"/>
    <!-- Flange Right -->
    <ellipse cx="180" cy="140" rx="10" ry="28" fill="#ca8a04" stroke="#fef08a" stroke-width="1"/>
    <!-- Bonnet Stem -->
    <rect x="92" y="35" width="16" height="50" fill="url(#brValve)" stroke="#ca8a04" stroke-width="1"/>
    <!-- Handwheel Wheel -->
    <ellipse cx="100" cy="30" rx="55" ry="16" fill="none" stroke="#eab308" stroke-width="9"/>
    <ellipse cx="100" cy="30" rx="55" ry="16" fill="none" stroke="#fef08a" stroke-width="1.5"/>
    <line x1="45" y1="30" x2="155" y2="30" stroke="#ca8a04" stroke-width="4"/>
    <line x1="100" y1="14" x2="100" y2="46" stroke="#ca8a04" stroke-width="4"/>
  </g>

  <!-- Heavy Bronze Bearing Sleeve Bushings (Right) -->
  <g transform="translate(360, 100)">
    <!-- Large Bushing -->
    <g transform="rotate(20 80 80)">
      <ellipse cx="80" cy="40" rx="60" ry="25" fill="url(#bronzeBushing)" stroke="#fef08a" stroke-width="1.5"/>
      <ellipse cx="80" cy="40" rx="38" ry="16" fill="#2d1607" stroke="#b45309" stroke-width="1.5"/>
      <path d="M 20,40 L 20,140 A 60 25 0 0 0 140,140 L 140,40 Z" fill="url(#bronzeBushing)" stroke="#ca8a04" stroke-width="1.5"/>
      <ellipse cx="80" cy="140" rx="60" ry="25" fill="#78350f" stroke="#ca8a04" stroke-width="1"/>
    </g>

    <!-- Smaller Hex Brass Fitting -->
    <g transform="translate(10, 140) rotate(-15 40 40)">
      <polygon points="40,10 70,25 70,55 40,70 10,55 10,25" fill="url(#brValve)" stroke="#fef08a" stroke-width="1.5"/>
      <circle cx="40" cy="40" r="16" fill="#451a03" stroke="#eab308" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Brass Chips / Swarf Curls (Bottom) -->
  <g transform="translate(80, 260)">
    <path d="M 0,20 Q 30,0 60,30 T 120,20 T 180,40" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20,35 Q 50,15 80,45 T 140,35 T 200,55" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50,50 Q 80,30 110,60 T 170,50" fill="none" stroke="#ca8a04" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Technical Spec Overlay Badge -->
  <rect x="25" y="25" width="235" height="42" rx="6" fill="#090d14" fill-opacity="0.85" stroke="#eab308" stroke-width="1.5"/>
  <circle cx="45" cy="46" r="6" fill="#facc15"/>
  <text x="62" y="43" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" letter-spacing="1">BRASS &amp; BRONZE (ISRI: HONEY)</text>
  <text x="62" y="58" fill="#fde047" font-family="'Poppins', sans-serif" font-size="11">Yellow Brass | Gunmetal &amp; Bushings</text>
</svg>