<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="alBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f16"/>
      <stop offset="60%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#1b283d"/>
    </linearGradient>
    <linearGradient id="alProfile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="alWheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <pattern id="alGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#223348" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#alBg)"/>
  <rect width="600" height="380" fill="url(#alGrid)" opacity="0.5"/>
  <circle cx="300" cy="190" r="150" fill="#38bdf8" opacity="0.1" filter="blur(40px)"/>

  <!-- Extruded Architectural Profiles Stack (Left) -->
  <g transform="translate(60, 95)">
    <!-- T-Profile 1 -->
    <path d="M 20,40 L 160,40 L 160,60 L 100,60 L 100,160 L 80,160 L 80,60 L 20,60 Z" fill="url(#alProfile)" stroke="#e2e8f0" stroke-width="1.2"/>
    <!-- Hollow Box Profile -->
    <g transform="translate(110, 30)">
      <polygon points="0,60 120,10 160,35 40,85" fill="url(#alProfile)" stroke="#cbd5e1" stroke-width="1.5"/>
      <polygon points="0,60 40,85 40,140 0,115" fill="#64748b"/>
      <polygon points="40,85 160,35 160,90 40,140" fill="#94a3b8"/>
      <!-- Inner hollow -->
      <polygon points="20,70 100,35 125,50 45,85" fill="#0f172a"/>
    </g>
    <!-- Angle Profile -->
    <g transform="translate(40, 120)">
      <polygon points="0,40 180,0 200,10 20,50" fill="url(#alProfile)" stroke="#f8fafc" stroke-width="1"/>
      <polygon points="0,40 20,50 20,110 0,100" fill="#475569"/>
    </g>
  </g>

  <!-- Cast Aluminium Alloy Wheel Rim (Right) -->
  <g transform="translate(370, 110)">
    <!-- Outer Rim Rim -->
    <circle cx="110" cy="110" r="95" fill="none" stroke="url(#alWheel)" stroke-width="26"/>
    <circle cx="110" cy="110" r="108" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="110" cy="110" r="82" fill="none" stroke="#334155" stroke-width="2"/>
    <!-- Center Hub -->
    <circle cx="110" cy="110" r="32" fill="url(#alProfile)" stroke="#64748b" stroke-width="2"/>
    <circle cx="110" cy="110" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <!-- 5 Wheel Spokes -->
    <g stroke="url(#alProfile)" stroke-width="16" stroke-linecap="round">
      <line x1="110" y1="78" x2="110" y2="22"/>
      <line x1="139" y1="99" x2="191" y2="78"/>
      <line x1="128" y1="135" x2="161" y2="188"/>
      <line x1="92" y1="135" x2="59" y2="188"/>
      <line x1="81" y1="99" x2="29" y2="78"/>
    </g>
    <!-- Lug nut holes -->
    <circle cx="110" cy="90" r="3" fill="#090d14"/>
    <circle cx="129" cy="104" r="3" fill="#090d14"/>
    <circle cx="122" cy="126" r="3" fill="#090d14"/>
    <circle cx="98" cy="126" r="3" fill="#090d14"/>
    <circle cx="91" cy="104" r="3" fill="#090d14"/>
  </g>

  <!-- Technical Spec Overlay Badge -->
  <rect x="25" y="25" width="235" height="42" rx="6" fill="#090d14" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="45" cy="46" r="6" fill="#38bdf8"/>
  <text x="62" y="43" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" letter-spacing="1">ALUMINIUM SCRAP (ISRI: TENSE)</text>
  <text x="62" y="58" fill="#93c5fd" font-family="'Poppins', sans-serif" font-size="11">6063 Extrusions | Cast Wheels &amp; Clips</text>
</svg>