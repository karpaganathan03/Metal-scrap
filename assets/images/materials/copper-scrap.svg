<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="60%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#1a2230"/>
    </linearGradient>
    <linearGradient id="cuPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="25%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="cuWire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="cuBusbar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <filter id="cuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="cuGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#253246" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#cuBg)"/>
  <rect width="600" height="380" fill="url(#cuGrid)" opacity="0.5"/>
  <circle cx="300" cy="190" r="150" fill="#ea580c" opacity="0.12" filter="blur(40px)"/>

  <!-- Copper Busbar Stack (Left) -->
  <g transform="translate(60, 110)">
    <!-- Base plate -->
    <polygon points="0,90 180,30 240,60 60,120" fill="url(#cuBusbar)" stroke="#ea580c" stroke-width="1.5"/>
    <polygon points="0,90 60,120 60,138 0,108" fill="#78350f"/>
    <polygon points="60,120 240,60 240,78 60,138" fill="#9a3412"/>

    <!-- Middle bar -->
    <polygon points="20,70 190,15 245,42 75,97" fill="url(#cuBusbar)" stroke="#fb923c" stroke-width="1.2"/>
    <polygon points="20,70 75,97 75,112 20,85" fill="#78350f"/>
    <polygon points="75,97 245,42 245,57 75,112" fill="#c2410c"/>

    <!-- Top bar with bolt holes -->
    <polygon points="35,50 195,0 240,22 80,72" fill="url(#cuBusbar)" stroke="#fdba74" stroke-width="1.5"/>
    <ellipse cx="90" cy="50" rx="9" ry="4" fill="#431407" stroke="#fdba74" stroke-width="1"/>
    <ellipse cx="150" cy="30" rx="9" ry="4" fill="#431407" stroke="#fdba74" stroke-width="1"/>
    <ellipse cx="200" cy="14" rx="8" ry="3.5" fill="#431407" stroke="#fdba74" stroke-width="1"/>
  </g>

  <!-- Heavy Copper Scrap Pipes (Right) -->
  <g transform="translate(340, 80)">
    <!-- Pipe 1 -->
    <g transform="rotate(-25 100 100)">
      <path d="M 20,50 L 220,50 L 220,95 L 20,95 Z" fill="url(#cuPipe)" stroke="#ea580c" stroke-width="1.5"/>
      <ellipse cx="20" cy="72.5" rx="14" ry="22.5" fill="url(#cuWire)"/>
      <ellipse cx="20" cy="72.5" rx="9" ry="16" fill="#431407"/>
      <ellipse cx="220" cy="72.5" rx="14" ry="22.5" fill="url(#cuPipe)"/>
    </g>
    <!-- Pipe 2 -->
    <g transform="translate(10, 80) rotate(15 80 80)">
      <path d="M 0,40 L 190,40 L 190,80 L 0,80 Z" fill="url(#cuPipe)" stroke="#f97316" stroke-width="1.5"/>
      <ellipse cx="0" cy="60" rx="12" ry="20" fill="url(#cuWire)"/>
      <ellipse cx="0" cy="60" rx="8" ry="14" fill="#431407"/>
    </g>
  </g>

  <!-- Bright Bare Millberry Copper Wires (Foreground Bundles) -->
  <g transform="translate(140, 210)">
    <path d="M 0,50 Q 80,10 160,45 T 320,30" fill="none" stroke="url(#cuWire)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 10,65 Q 90,25 170,60 T 330,45" fill="none" stroke="url(#cuWire)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -5,80 Q 75,40 155,75 T 315,60" fill="none" stroke="url(#cuWire)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 25,95 Q 105,55 185,90 T 345,75" fill="none" stroke="url(#cuWire)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 5,110 Q 85,70 165,105 T 325,90" fill="none" stroke="url(#cuWire)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Technical Spec Overlay Badge -->
  <rect x="25" y="25" width="220" height="42" rx="6" fill="#090d14" fill-opacity="0.85" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="45" cy="46" r="6" fill="#f97316"/>
  <text x="62" y="43" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" letter-spacing="1">COPPER SCRAP (ISRI: BERRY)</text>
  <text x="62" y="58" fill="#fdba74" font-family="'Poppins', sans-serif" font-size="11">Millberry 99.9% Cu | Busbars &amp; Pipes</text>
</svg>