<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="60%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#1b283d"/>
    </linearGradient>
    <linearGradient id="sheetMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="brassSwarf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <pattern id="gridPattern7" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#202b3d" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad7)"/>
  <rect width="600" height="380" fill="url(#gridPattern7)" opacity="0.6"/>
  <circle cx="300" cy="190" r="140" fill="#10b981" opacity="0.12" filter="blur(30px)"/>

  <!-- Punched Sheet Metal Skeleton Blank (Top Left to Bottom Right) -->
  <g transform="translate(80, 80)">
    <!-- Flat Stamped Plate with Perforations -->
    <polygon points="20,40 380,20 420,160 60,180" fill="url(#sheetMetal)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Punched Out Circles (Holes in Skeleton) -->
    <ellipse cx="90" cy="80" rx="22" ry="16" fill="#0e141f" stroke="#334155" stroke-width="3"/>
    <ellipse cx="170" cy="70" rx="22" ry="16" fill="#0e141f" stroke="#334155" stroke-width="3"/>
    <ellipse cx="250" cy="60" rx="22" ry="16" fill="#0e141f" stroke="#334155" stroke-width="3"/>
    <ellipse cx="330" cy="50" rx="22" ry="16" fill="#0e141f" stroke="#334155" stroke-width="3"/>

    <ellipse cx="110" cy="130" rx="22" ry="16" fill="#0e141f" stroke="#334155" stroke-width="3"/>
    <ellipse cx="190" cy="120" rx="22" ry="16" fill="#0e141f" stroke="#334155" stroke-width="3"/>
    <ellipse cx="270" cy="110" rx="22" ry="16" fill="#0e141f" stroke="#334155" stroke-width="3"/>
    <ellipse cx="350" cy="100" rx="22" ry="16" fill="#0e141f" stroke="#334155" stroke-width="3"/>
  </g>

  <!-- CNC Lathe Turnings / Metal Swarf Spirals (Bottom Foreground) -->
  <g transform="translate(40, 200)">
    <!-- Spiral Curls -->
    <path d="M 80,80 Q 120,40 160,80 T 240,80 T 320,80" fill="none" stroke="url(#brassSwarf)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 140,110 Q 180,60 220,110 T 300,110 T 380,110" fill="none" stroke="#f3cf2d" stroke-width="10" stroke-linecap="round"/>
    <path d="M 220,90 Q 260,50 300,90 T 380,90 T 460,90" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>

    <!-- Small Busheling Discs / Stamping Pellets -->
    <circle cx="80" cy="120" r="14" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <circle cx="115" cy="135" r="16" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="360" cy="130" r="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <circle cx="420" cy="120" r="15" fill="#facc15" stroke="#a16207" stroke-width="2"/>
    <circle cx="460" cy="135" r="12" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="250" height="34" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" fill="#6ee7b7" letter-spacing="1">MANUFACTURING &amp; PRODUCTION</text>
  </g>

  <!-- Specs Overlay Ribbon -->
  <g transform="translate(380, 30)">
    <rect width="190" height="34" rx="4" fill="rgba(243, 207, 45, 0.15)" stroke="#f3cf2d" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13" fill="#f3cf2d">BUSHELING &amp; CNC SWARF</text>
  </g>
</svg>
