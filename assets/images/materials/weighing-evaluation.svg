<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="wbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="60%" stop-color="#131c2a"/>
      <stop offset="100%" stop-color="#1b283d"/>
    </linearGradient>
    <linearGradient id="wbDeck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#wbBg)"/>

  <!-- Computerized Pitless Truck Scale Deck -->
  <g transform="translate(60, 110)">
    <!-- Scale Platform Deck -->
    <polygon points="20,110 360,50 440,90 100,150" fill="url(#wbDeck)" stroke="#f3cf2d" stroke-width="2"/>
    <polygon points="20,110 100,150 100,175 20,135" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <polygon points="100,150 440,90 440,115 100,175" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Load Cell Mounting Blocks (4 Visible) -->
    <rect x="40" y="132" width="22" height="14" fill="#f59e0b" rx="2"/>
    <rect x="150" y="152" width="22" height="14" fill="#f59e0b" rx="2"/>
    <rect x="330" y="105" width="22" height="14" fill="#f59e0b" rx="2"/>
    <rect x="410" y="85" width="22" height="14" fill="#f59e0b" rx="2"/>

    <!-- Guide Guardrails -->
    <line x1="20" y1="100" x2="360" y2="40" stroke="#fde047" stroke-width="4"/>
    <line x1="100" y1="140" x2="440" y2="80" stroke="#fde047" stroke-width="4"/>
  </g>

  <!-- Digital Weighbridge Remote Display Indicator Tower (Right) -->
  <g transform="translate(370, 50)">
    <!-- Display Mast -->
    <rect x="75" y="110" width="16" height="160" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Digital Scoreboard Housing -->
    <rect x="10" y="40" width="150" height="70" rx="6" fill="#090d14" stroke="#f3cf2d" stroke-width="2"/>
    <!-- Glowing Red/Amber 7-Segment LED Numbers -->
    <text x="30" y="86" fill="#ef4444" font-family="'Courier New', monospace" font-weight="900" font-size="34" letter-spacing="3">42,860</text>
    <text x="135" y="75" fill="#f59e0b" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14">KG</text>
    <text x="35" y="100" fill="#10b981" font-family="'Poppins', sans-serif" font-size="9" letter-spacing="1">GROSS WEIGHT VERIFIED</text>
  </g>

  <!-- Handheld XRF Alloy Analyzer (Bottom Left) -->
  <g transform="translate(50, 240)">
    <rect x="15" y="15" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="30" y="42" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14">NITON XRF ASSAY</text>
    <text x="30" y="60" fill="#38bdf8" font-family="'Poppins', sans-serif" font-weight="600" font-size="12">Ni: 8.24% | Cr: 18.15%</text>
    <text x="30" y="75" fill="#10b981" font-family="'Poppins', sans-serif" font-size="10">GRADE: SS 304 PASS</text>
  </g>

  <!-- Technical Spec Overlay Badge -->
  <rect x="25" y="25" width="250" height="42" rx="6" fill="#090d14" fill-opacity="0.85" stroke="#f3cf2d" stroke-width="1.5"/>
  <circle cx="45" cy="46" r="6" fill="#10b981"/>
  <text x="62" y="43" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" letter-spacing="1">WEIGHING &amp; ALLOY ANALYSIS</text>
  <text x="62" y="58" fill="#86efac" font-family="'Poppins', sans-serif" font-size="11">100-Ton Weighbridge | Handheld XRF</text>
</svg>