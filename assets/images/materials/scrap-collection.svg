<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="truckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="60%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#1a2538"/>
    </linearGradient>
    <linearGradient id="truckCab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="binSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#truckBg)"/>

  <!-- Road / Yard Ground -->
  <polygon points="0,290 600,290 600,380 0,380" fill="#0d1117"/>
  <line x1="0" y1="290" x2="600" y2="290" stroke="#f3cf2d" stroke-width="3" stroke-dasharray="18 12"/>

  <!-- Heavy Commercial Tri-Axle Roll-Off Truck -->
  <g transform="translate(60, 95)">
    <!-- 40-Yard Steel Roll-off Container Bin (Tilted on Hook-lift) -->
    <g transform="rotate(-12 300 200)">
      <polygon points="120,40 380,40 370,140 130,140" fill="url(#binSteel)" stroke="#f3cf2d" stroke-width="2"/>
      <!-- Ribs on Container -->
      <line x1="160" y1="40" x2="170" y2="140" stroke="#475569" stroke-width="3"/>
      <line x1="210" y1="40" x2="220" y2="140" stroke="#475569" stroke-width="3"/>
      <line x1="260" y1="40" x2="270" y2="140" stroke="#475569" stroke-width="3"/>
      <line x1="310" y1="40" x2="320" y2="140" stroke="#475569" stroke-width="3"/>
      <!-- Container Top Lip -->
      <rect x="115" y="34" width="270" height="8" rx="2" fill="#64748b"/>
      <!-- Ferromax Bin Stencil -->
      <text x="210" y="95" fill="#f3cf2d" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="22" letter-spacing="2">FERROMAX 40-YD</text>
    </g>

    <!-- Hook-lift Arm Hydraulic Boom -->
    <polygon points="340,110 355,100 375,170 360,180" fill="#f59e0b" stroke="#000" stroke-width="1.5"/>
    <circle cx="367" cy="175" r="7" fill="#334155" stroke="#f3cf2d" stroke-width="2"/>

    <!-- Truck Chassis Frame -->
    <rect x="60" y="165" width="400" height="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

    <!-- Commercial Day Cab (Left) -->
    <path d="M 60,165 L 60,70 L 105,70 L 135,115 L 140,165 Z" fill="url(#truckCab)" stroke="#090d14" stroke-width="2"/>
    <!-- Windshield -->
    <polygon points="95,78 105,78 128,112 95,112" fill="#0f172a" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Headlight -->
    <rect x="58" y="140" width="8" height="15" fill="#ffffff" rx="2"/>

    <!-- Truck Wheels (3 Axles Rear + 1 Front) -->
    <!-- Front Wheel -->
    <circle cx="95" cy="190" r="26" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="95" cy="190" r="14" fill="#94a3b8"/>
    <!-- Rear Tandem 1 -->
    <circle cx="330" cy="190" r="26" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="330" cy="190" r="14" fill="#94a3b8"/>
    <!-- Rear Tandem 2 -->
    <circle cx="385" cy="190" r="26" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="385" cy="190" r="14" fill="#94a3b8"/>
    <!-- Rear Tandem 3 -->
    <circle cx="440" cy="190" r="26" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="440" cy="190" r="14" fill="#94a3b8"/>
  </g>

  <!-- Technical Spec Overlay Badge -->
  <rect x="25" y="25" width="245" height="42" rx="6" fill="#090d14" fill-opacity="0.85" stroke="#f3cf2d" stroke-width="1.5"/>
  <circle cx="45" cy="46" r="6" fill="#f3cf2d"/>
  <text x="62" y="43" fill="#ffffff" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" letter-spacing="1">SCRAP COLLECTION &amp; FLEET</text>
  <text x="62" y="58" fill="#fde047" font-family="'Poppins', sans-serif" font-size="11">Hook-Lift Roll-Off Bins | 15-50 Yd Capacity</text>
</svg>