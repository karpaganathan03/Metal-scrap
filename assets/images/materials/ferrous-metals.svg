<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="60%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#1b283d"/>
    </linearGradient>
    <linearGradient id="steelBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="ironPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3cf2d"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#202b3d" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgGrad)"/>
  <rect width="600" height="380" fill="url(#gridPattern)" opacity="0.6"/>

  <!-- Glowing Aura -->
  <circle cx="300" cy="190" r="140" fill="#3b82f6" opacity="0.12" filter="blur(30px)"/>

  <!-- Heavy Ferrous Steel I-Beam 1 (Left perspective) -->
  <g transform="translate(60, 90)">
    <!-- Flange Top -->
    <polygon points="40,20 180,20 160,40 20,40" fill="#64748b"/>
    <!-- Web Vertical -->
    <polygon points="90,40 110,40 110,180 90,180" fill="#334155"/>
    <polygon points="100,40 110,40 110,180 100,180" fill="#1e293b"/>
    <!-- Flange Bottom -->
    <polygon points="20,180 160,180 180,200 40,200" fill="#475569"/>
    <!-- Beam Body Depth -->
    <polygon points="180,20 340,60 320,80 160,40" fill="#475569"/>
    <polygon points="320,80 340,60 340,220 320,240" fill="#1e293b"/>
    <polygon points="160,180 320,220 340,240 180,200" fill="#334155"/>
  </g>

  <!-- Rail Track Section (Right) -->
  <g transform="translate(320, 110)">
    <!-- Rail Head -->
    <path d="M 50,30 Q 75,20 100,30 L 95,50 Q 75,45 55,50 Z" fill="#94a3b8"/>
    <!-- Rail Web -->
    <rect x="70" y="50" width="10" height="80" fill="#475569"/>
    <!-- Rail Base -->
    <polygon points="30,130 120,130 135,150 15,150" fill="#334155"/>
    <!-- Depth 3D -->
    <polygon points="100,30 200,60 195,80 95,50" fill="#64748b"/>
    <polygon points="195,80 200,60 200,170 195,190" fill="#1e293b"/>
    <polygon points="120,130 220,160 235,180 135,150" fill="#475569"/>
  </g>

  <!-- Cast Iron Engine Gear / Rotor (Front Center) -->
  <g transform="translate(240, 210)">
    <circle cx="60" cy="60" r="50" fill="#1e293b" stroke="#64748b" stroke-width="8"/>
    <circle cx="60" cy="60" r="32" fill="#0f172a" stroke="#f3cf2d" stroke-width="3" stroke-dasharray="8 4"/>
    <circle cx="60" cy="60" r="16" fill="#334155"/>
    <!-- Gear teeth -->
    <rect x="54" y="2" width="12" height="12" fill="#94a3b8"/>
    <rect x="54" y="106" width="12" height="12" fill="#94a3b8"/>
    <rect x="2" y="54" width="12" height="12" fill="#94a3b8"/>
    <rect x="106" y="54" width="12" height="12" fill="#94a3b8"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="180" height="34" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" fill="#93c5fd" letter-spacing="1">FERROUS METALS</text>
  </g>

  <!-- Specs Overlay Ribbon -->
  <g transform="translate(410, 30)">
    <rect width="160" height="34" rx="4" fill="rgba(243, 207, 45, 0.15)" stroke="#f3cf2d" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13" fill="#f3cf2d">ISRI 200 - 206 / HMS</text>
  </g>
</svg>
